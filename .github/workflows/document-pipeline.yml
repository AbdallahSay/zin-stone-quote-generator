name: Original Word and PDF pipeline
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  original-template-pipeline:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install PyMuPDF==1.26.7
      - run: dotnet run --project document-tests/ZinStone.DocumentTests.csproj -c Release -- . document-test-artifacts
      - run: python document-tests/verify_pdf.py document-test-artifacts
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: original-template-docx-pdf-evidence
          path: document-test-artifacts/
          retention-days: 14
