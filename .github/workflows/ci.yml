name: ZIN STONE CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build, Test & Security Verification
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: '10.0.x'

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'

      - name: Restore Dependencies
        run: |
          dotnet restore backend/FactoryQuoteApi.csproj
          dotnet restore security-tests/FactoryQuoteApi.SecurityTests.csproj

      - name: Build Backend & Tests (Release)
        run: |
          dotnet build backend/FactoryQuoteApi.csproj -c Release --no-restore
          dotnet build security-tests/FactoryQuoteApi.SecurityTests.csproj -c Release --no-restore

      - name: Run Backend Security & Functional Tests
        run: dotnet test security-tests/FactoryQuoteApi.SecurityTests.csproj -c Release --no-build

      - name: Run Frontend XSS & Security Regression Tests
        run: |
          node security-tests/xss-regression-tests.cjs
          node security-tests/isolation-source-tests.cjs

      - name: Validate Dockerfile Syntax
        run: docker build --target build -t zin-stone-api-build .

      - name: Publish deployable IIS build
        run: dotnet publish backend/FactoryQuoteApi.csproj -c Release --no-restore -o publish -p:SourceRevisionId=${{ github.sha }}

      - name: Upload IIS release artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: zin-stone-iis-${{ github.sha }}
          path: publish/
          retention-days: 14